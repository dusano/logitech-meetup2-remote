# UVC control protocol details for zoom and pan/tilt on the Logitech MeetUp 2.
# How the device layer addresses the camera's USB Video Class control interface.

video_control_interface:
  usb_interface_class: 14        # CC_VIDEO
  usb_interface_subclass: 1      # SC_VIDEOCONTROL
  access: >
    Obtain an IOKit USB interface interface for the video control interface
    (IOCreatePlugInInterfaceForService + QueryInterface for IOUSBInterfaceInterface),
    open it, and issue class-specific control requests through it.

requests:
  bmRequestType:
    read: 0xA1                   # device-to-host, class, interface
    write: 0x21                  # host-to-device, class, interface
  bRequest:
    SET_CUR: 0x01
    GET_CUR: 0x81
    GET_MIN: 0x82
    GET_MAX: 0x83

controls:
  byte_order: >
    All multi-byte UVC values are little-endian (standard USB byte order),
    both in requests (SET_CUR payload) and responses (GET_* payloads).
  zoom:
    selector: 0x0B               # CT_ZOOM_ABSOLUTE_CONTROL
    length_bytes: 2
    value: unsigned 2-byte little-endian zoom position
  pan_tilt_relative:
    selector: 0x0E               # CT_PANTILT_RELATIVE_CONTROL - the control the MeetUp 2 actually implements
    length_bytes: 4
    value: >
      byte 0: pan direction as a signed byte (1 = clockwise/right, 0xFF = -1 =
      counter-clockwise/left, 0 = stop); byte 1: pan speed as an unsigned byte;
      byte 2: tilt direction as a signed byte (1 = up, 0xFF = -1 = down,
      0 = stop); byte 3: tilt speed as an unsigned byte.
      The MeetUp 2 reports speed 1 as both minimum and maximum.
    movement_pulse: >
      A short movement pulse is: SET_CUR with the chosen direction and speed 1,
      wait a short fixed duration (on the order of 100-300 ms), then SET_CUR
      with direction 0 (stop) for that axis. The camera enforces its own
      mechanical limits.
  pan_tilt_absolute_quirk: >
    Verified against the live device: CT_PANTILT_ABSOLUTE_CONTROL (0x0D)
    on the MeetUp 2 is non-functional for position reporting - GET_CUR always
    returns all zeros regardless of the camera's actual orientation, and the
    reported range (0..255) is not a real position range. Do not use the
    absolute control for pan/tilt; use pan_tilt_relative, and do not display
    a pan/tilt position (the device does not report one).

macos_access:
  interface_discovery: >
    Find the video control interface as a child service of the matched USB
    device in the IOService plane: iterate the device's children of class
    IOUSBHostInterface and select the one whose IORegistry properties report
    bInterfaceClass == 14 and bInterfaceSubClass == 1. Read its
    bInterfaceNumber property for the wIndex low byte.
  interface_interface: >
    Create the plug-in with IOCreatePlugInInterfaceForService using
    kIOUSBInterfaceUserClientTypeID, then QueryInterface for
    IOUSBInterfaceInterface (version 190 or later, e.g. 300).
  exclusive_access_workaround: >
    Do NOT require USBInterfaceOpen to succeed. macOS's own UVC driver
    (AppleUSBVDC) holds the video control interface, so USBInterfaceOpen
    returns kIOReturnExclusiveAccess (0xE00002C5). Class-specific control
    requests still work without opening the interface: send them with
    ControlRequest (not DeviceRequest) on pipe reference 0 (the default
    control endpoint). Treat an exclusive-access open failure as non-fatal
    and proceed to issue control requests.
  iterator_handle_lifetime: >
    When looping over an io_iterator_t, each service handle must be released
    only after that iteration's work is fully done. Never combine a deferred
    release with reassigning the loop variable at the end of the body: the
    deferred release then frees the NEWLY fetched handle before it is used,
    which makes its registry properties unreadable (empty name, vendor
    0x0000) and silently truncates enumeration after the first device -
    whether detection works then depends only on device order. Fetch the
    next handle at the top of each iteration (for example
    "while case let device = IOIteratorNext(it), device != 0 {
    defer { IOObjectRelease(device) } ... }") so every deferred release is
    scoped to the handle fetched in that same iteration.
  lifecycle_and_robustness: >
    Create the interface access exactly once per process and reuse it for
    every subsequent request; never create and destroy plug-ins per request.
    After QueryInterface succeeds, release the CFPlugIn (keep only the
    queried interface interface). If plug-in creation fails with
    kIOReturnNoResources, retry up to 3 times with a 100 ms pause before
    falling back - the failure is often transient contention with system
    USB daemons. Read the child interface's identity properties
    (bInterfaceClass, bInterfaceSubClass, bInterfaceNumber) directly with
    IORegistryEntryCreateCFProperty on the interface registry entry.
  plugin_fallback: >
    IOCreatePlugInInterfaceForService with kIOUSBInterfaceUserClientTypeID on
    the interface service can fail with kIOReturnNoResources (-536870210,
    0xE00002BE) in some process environments (observed under the arm64e Swift
    test runner) even though it succeeds in a plain app process. When it
    fails, fall back to the DEVICE level: create the plug-in on the matched
    USB device service with kIOUSBDeviceUserClientTypeID, QueryInterface for
    IOUSBDeviceInterface, and send the same class-interface control requests
    via its DeviceRequest() call. No USBDeviceOpen is required for control
    requests on the default pipe; if open is attempted and fails with
    exclusive access, proceed anyway. The request fields (bmRequestType,
    bRequest, wValue, wIndex including the interface number in the low byte)
    are identical in both paths, so the fallback only changes which IOKit
    object carries the request. Detection succeeds when either path yields a
    working request channel.
  unit_id_fallback: >
    If parsing the class-specific VC descriptors is not feasible, probe unit
    IDs 1 through 4 with a GET_MIN request for the zoom control and use the
    first unit ID that returns success.

addressing:
  wValue: control selector shifted left by 8 bits (selector << 8)
  wIndex: >
    camera terminal unit ID shifted left by 8 bits, OR-ed with the video
    control interface number ((unit_id << 8) | interface_number)
  unit_id_discovery: >
    Parse the camera terminal unit ID from the video control interface's
    class-specific descriptors (the Input Terminal descriptor of terminal
    type camera, wTerminalType 0x0201 ITT_CAMERA).
